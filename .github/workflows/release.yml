name: Build & release

# Any push to main that changes package.json (i.e. a version bump) builds the
# Windows installer and publishes it as GitHub Release v<version>, together with
# latest.yml + .blockmap, which is what installed copies check for updates.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Jarvis v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/Jarvis-Setup-*.exe
            dist/Jarvis-Setup-*.exe.blockmap
            dist/latest.yml
