name: Build & release

# Any push to main that changes package.json (i.e. a version bump) builds the
# Windows installer and publishes it as GitHub Release v<version>. Installed
# copies of Jarvis pick it up automatically. A version that's already released
# is skipped by electron-builder, so re-runs are harmless.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
